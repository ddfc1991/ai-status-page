<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Channel Status</title>
<style>
:root {
  --bg1: #0f1117; --bg2: #161a23;
  --glass: rgba(255,255,255,0.06);
  --glass-brd: rgba(255,255,255,0.10);
  --txt: #e8eaf0; --dim: #9aa3b5;
  --ok: #34d399; --warn: #fbbf24; --bad: #f87171; --unknown: #64748b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, var(--bg1), var(--bg2));
  color: var(--txt); min-height: 100vh; padding: 24px 16px 48px;
}
.container { max-width: 860px; margin: 0 auto; }
header { text-align:center; margin-bottom: 28px; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: 0.3px; }
h1 .dot { color: var(--ok); }
.sub { color: var(--dim); margin-top: 6px; font-size: 13px; }
.summary {
  display: flex; gap: 12px; justify-content: center; margin: 18px 0 26px; flex-wrap: wrap;
}
.pill {
  background: var(--glass); border: 1px solid var(--glass-brd); border-radius: 999px;
  padding: 6px 16px; font-size: 13px; color: var(--dim); backdrop-filter: blur(12px);
}
.pill b { color: var(--txt); }
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px;
}
.card {
  background: var(--glass); border: 1px solid var(--glass-brd); border-radius: 16px;
  padding: 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: border-color 0.3s, transform 0.15s; position: relative; overflow: hidden;
}
.card:hover { transform: translateY(-2px); }
.card .head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.lamp {
  width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
  background: var(--unknown); box-shadow: 0 0 0 0 rgba(0,0,0,0);
}
.lamp.ok { background: var(--ok); box-shadow: 0 0 10px 2px rgba(52,211,153,0.4); }
.lamp.warn { background: var(--warn); box-shadow: 0 0 10px 2px rgba(251,191,36,0.4); }
.lamp.bad { background: var(--bad); box-shadow: 0 0 10px 2px rgba(248,113,113,0.4); }
.card .name { font-weight: 600; font-size: 15px; }
.card .kind {
  margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 6px;
  background: rgba(255,255,255,0.08); color: var(--dim);
}
.card .desc { font-size: 12.5px; color: var(--dim); line-height: 1.45; min-height: 34px; }
.card .meta { display:flex; justify-content:space-between; margin-top: 12px; font-size: 12px; color: var(--dim); }
.card .code { font-family: ui-monospace, Menlo, monospace; }
.card .note { margin-top: 8px; font-size: 11px; color: #6b7a95; }
.card.checking .lamp { animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
footer { text-align:center; color: #5b6478; font-size: 12px; margin-top: 32px; }
.last { color: var(--dim); font-size: 12px; text-align:center; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>AI 通道<span class="dot">●</span>状态</h1>
    <div class="sub">免费托管于 Render · 自动探测 · 不存储任何密钥</div>
  </header>
  <div class="summary">
    <div class="pill">在线 <b id="c-ok">0</b></div>
    <div class="pill">异常 <b id="c-bad">0</b></div>
    <div class="pill">检测中 <b id="c-run">0</b></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="last" id="last-check">加载中…</div>
  <footer>Render Static Site · 由 Mibot 搭建 · 每 60 秒自动刷新</footer>
</div>

<script>
let CONFIG = null;
const grid = document.getElementById('grid');

function corsProxies(url) {
  return [
    'https://corsproxy.io/?url=' + encodeURIComponent(url),
    'https://api.allorigins.win/get?url=' + encodeURIComponent(url)
  ];
}

async function probe(ch) {
  const t0 = performance.now();
  // 1) 直连
  try {
    const r = await fetch(ch.url, { method:'GET', mode:'cors', redirect:'follow' });
    return { code: r.status, ms: Math.round(performance.now()-t0), via: 'direct' };
  } catch(e) {}
  // 2) CORS 中转（corsproxy.io 透传上游状态码，allorigins 包 {contents}）
  for (const p of corsProxies(ch.url)) {
    try {
      const r = await fetch(p, { method:'GET', mode:'cors' });
      const j = await r.json().catch(()=>({}));
      const bodyText = j && j.contents ? j.contents : '';
      const ok = r.ok || (bodyText && bodyText.length > 20);
      if (ok) return { code: r.ok ? 200 : 200, ms: Math.round(performance.now()-t0), via: 'proxy' };
    } catch(e) {}
  }
  return { code: 0, ms: Math.round(performance.now()-t0), via: 'fail' };
}

function render(ch, res) {
  const ok = res && (ch.okCodes.includes(res.code) || (res.via === 'proxy' && res.code === 200));
  const state = ok ? 'ok' : (res && res.code ? 'bad' : 'unknown');
  const label = state === 'ok' ? '在线' : (state === 'bad' ? '异常' : '离线');
  const lamp = state;
  return `
  <div class="card ${state}">
    <div class="head">
      <span class="lamp ${lamp}"></span>
      <span class="name">${ch.name}</span>
      <span class="kind">${ch.kind}</span>
    </div>
    <div class="desc">${ch.desc}</div>
    <div class="meta">
      <span class="code">${res ? (res.code || '—') : '…'}</span>
      <span>${res ? res.ms + 'ms · ' + (res.via==='proxy'?'中转':res.via) : '检测中'}</span>
    </div>
    ${ch.note ? `<div class="note">${ch.note}</div>` : ''}
  </div>`;
}

async function checkAll() {
  const cards = [...document.querySelectorAll('.card')];
  cards.forEach(c => c.classList.add('checking'));
  let ok=0, bad=0;
  for (let i=0;i<CONFIG.channels.length;i++) {
    const ch = CONFIG.channels[i];
    const res = await probe(ch);
    const good = res && (ch.okCodes.includes(res.code) || (res.via==='proxy' && res.code===200));
    if (good) ok++; else bad++;
    const el = document.querySelectorAll('.card')[i];
    if (el) el.outerHTML = render(ch, res);
    document.getElementById('c-ok').textContent = ok;
    document.getElementById('c-bad').textContent = bad;
    document.getElementById('c-run').textContent = CONFIG.channels.length - i - 1;
  }
  document.getElementById('c-run').textContent = 0;
  const t = new Date();
  document.getElementById('last-check').textContent = '上次检测 ' + t.toLocaleTimeString();
}

async function boot() {
  const r = await fetch('status.json');
  CONFIG = await r.json();
  grid.innerHTML = CONFIG.channels.map(ch => render(ch, null)).join('');
  document.getElementById('c-run').textContent = CONFIG.channels.length;
  await checkAll();
  setInterval(checkAll, CONFIG.refresh * 1000);
}
boot();
</script>
</body>
</html>
